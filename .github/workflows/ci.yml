name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test -- --watchAll=false --forceExit
        env:
          CI: "true"

      - name: Build
        run: npm run build
        env:
          CI: "false" # CRA treats warnings as errors when CI=true; existing code has lint warnings

      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: build/
          retention-days: 7
